# AI_MODEL is a public model identifier; NEXT_PUBLIC_SUPABASE_URL and
# NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY / NEXT_PUBLIC_SUPABASE_ANON_KEY are public browser keys (protected by RLS).
# Keep secrets scanning enabled for OPENROUTER_API_KEY, SUPABASE_SECRET_KEY, and SUPABASE_SERVICE_ROLE_KEY.
[build.environment]
  SECRETS_SCAN_OMIT_KEYS = "AI_MODEL,NEXT_PUBLIC_SUPABASE_URL,NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY,NEXT_PUBLIC_SUPABASE_ANON_KEY,NEXT_PUBLIC_FEEDBACK_URL,NEXT_PUBLIC_WA_URL,NEXT_PUBLIC_SITE_URL"
